{% extends "base.html" %}

{% block htmltitle %}
    {{<title_or_last component={section} />}} - {{ config.title }}
{% endblock htmltitle %}

{% block title %}
    {{<title_or_last component={section} />}}
{% endblock title %}

{% block content %}
<ul>
    {% for page in section.pages %}
        <li>
            {% if page.date %}
                {{<format_date date={page.date} config={config} />}} -- 
            {% endif %}
            <a href="{{ page.permalink }}">{{<title_or_last component={page} offset={0} />}}</a>
        </li>    
    {% endfor %}
</ul>
{% endblock content %}
